          <ul>
            <li><strong>Aperture (Bukaan Diafragma / f-stop):</strong> Mengawal jumlah kuantiti cahaya yang menembusi kanta fizikal dan mengawal Kedalaman Medan (Depth of Field). Nilai f-stop kecil seperti f/1.4 menghasilkan bukaan besar (bokeh kabur belakang), manakala f/16 menghasilkan bukaan kecil (tajam dari depan ke belakang).</li>
            <li><strong>Shutter Speed (Kelajuan Pengatup):</strong> Tempoh masa tirai sensor terdedah kepada cahaya. Kelajuan pantas (1/1000s) membekukan aksi laju, manakala kelajuan perlahan (1/4s) mencipta kesan kabur pergerakan (motion blur).</li>
            <li><strong>ISO (Kepekaan Penguatan Sensor):</strong> Sensitiviti sensor terhadap cahaya. ISO 100 memberikan imej bersih tanpa hingar, manakala ISO 6400 membolehkan tangkapan dalam suasana gelap tetapi menambah hingar (noise/grain).</li>
          </ul>
        `

            <li><strong>Kanta Standard (50mm):</strong> Meniru sudut pandangan normal penglihatan mata manusia tanpa herotan perspektif.</li>
            <li><strong>Kanta Telefoto (>70mm):</strong> Memampatkan latar belakang, mendekatkan subjek jauh dan memisahkan subjek daripada latar belakang (portrait & sukan).</li>

      if (CHAPTERS_DATABASE[subject.id] && CHAPTERS_DATABASE[subject.id].length >= subject.chaptersCount) {
        return CHAPTERS_DATABASE[subject.id];
      }

      const existing = CHAPTERS_DATABASE[subject.id] || [];
      const generated = [...existing];
      const countNeeded = subject.chaptersCount || 15;

      const TOPIC_PRESETS = [
        { t: "Pengenalan, Falsafah Asas & Kerangka Teori", desc: "Membincangkan konsep asas, sejarah perkembangan industri, definisi istilah penting dan etika profesional." },

        { t: "Aliran Kerja Pra-Produksi & Perancangan Strategik", desc: "Metodologi penyediaan kertas kerja, visualisasi konsep, bajet, storyboard, dan persediaan logistik." },
        { t: "Kawalan Teknikal, Aplikasi Lapangan & Pengendalian Sistem", desc: "Langkah demi langkah pelaksanaan di set penggambaran, studio, atau bilik kawalan operasi." },
        { t: "Psikologi Persepsi, Estetik Visual & Komposisi Lanjutan", desc: "Bagaimana audiens mentafsirkan susunan visual, warna, bahasa spatial, dan hierarki perhatian." },

        { t: "Kajian Kes Lapangan, Analisis Krisis & Kajian Kejayaan Industri", desc: "Bedah siasat projek sebenar industri media tempatan dan antarabangsa berserta pengajaran praktikal." },

      ];

      for (let i = generated.length + 1; i <= countNeeded; i++) {
        const preset = TOPIC_PRESETS[(i - 1) % TOPIC_PRESETS.length];
        generated.push({
          id: `${subject.id}-c${i}`,
          number: i,
          title: `Bab ${i}: ${preset.t} dalam ${subject.title}`,
          readTime: `${10 + (i % 6)} minit`,
          content: `
            <h2>Pengenalan Bab ${i}: ${subject.title}</h2>
            <p>Bab ini meneroka secara mendalam aspek <strong>${preset.t}</strong> yang menjadi teras kepada kurikulum ${subject.title} (${subject.enTitle}). Dalam konteks industri kreatif dan komunikasi profesional hari ini, pemahaman teknikal yang tepat amat penting bagi memastikan setiap karya menepati standard industri.</p>
            
            <h3>1. Konsep Utama & Penerangan Teori</h3>
            <p>${preset.desc}</p>
            <p>Setiap pengamal media wajib memahami hubungan sebab dan akibat antara parameter teknikal yang dipilih dengan kesan psikologi audiens. Ketepatan dalam fasa ini membezakan karya amatur berbanding karya bertaraf profesional.</p>
            
            <h3>2. Aplikasi Praktikal di Lapangan</h3>
            <ul>
              <li><strong>Standard Operasi:</strong> Menepati garis panduan teknikal penyiaran dan piawaian industri.</li>
              <li><strong>Penyelesaian Masalah (Troubleshooting):</strong> Kaedah bertindak pantas sekiranya berlaku kekangan di lokasi penggambaran atau semasa siaran langsung.</li>
              <li><strong>Integrasi Pasukan:</strong> Koordinasi lancar antara bahagian pengarahan, teknikal, juruvideo, dan pengurusan komunikasi.</li>

            </div>
          `
        });
      }

      CHAPTERS_DATABASE[subject.id] = generated;

      const idx = AppState.completedChapters.indexOf(chapId);
      if (idx > -1) {

      if (modal && iframe) {
        iframe.src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1&rel=0`;

        modal.classList.remove('hidden');

    function setKuleshov(emoji, label, perception) {
      const target = document.getElementById('kuleshovTarget');
      const targetLabel = document.getElementById('kuleshovTargetLabel');
      const result = document.getElementById('kuleshovResult');
      if (target) target.textContent = emoji;
      if (targetLabel) targetLabel.textContent = 'Syot 2: ' + label;
      if (result) result.textContent = 'Penonton mentafsirkan wajah neutral tersebut menunjukkan emosi: ' + perception;
    }

        { id: 4, name: "Seni Bina Mesej Teras (Message House)", desc: "Payung mesej utama (Roof), 3 tiang sokongan (Pillars), dan bukti fakta (Proof Points)." },
        { id: 5, name: "Templat Siaran Media Piawai (Press Release)", desc: "Format piramid terbalik (5W1H), petikan jurucakap, dan latar belakang organisasi." },
        { id: 6, name: "Matriks Eskalasi Krisis (Crisis Escalation Matrix)", desc: "Protokol penarafan krisis (Tahap Hijau, Kuning, Merah) dan garis kuasa tindakan." }
      ];

      return `
        <div class="space-y-8">
          <div class="p-8 rounded-3xl bg-cinematic-900 border border-cinematic-800 space-y-3">
            <span class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">Pusat 6: Eksekutif</span>
            <h1 class="text-2xl sm:text-4xl font-black text-white">Repositori 23 Templat Komunikasi Sedia Guna</h1>
            <p class="text-xs sm:text-sm text-slate-300 leading-relaxed max-w-3xl">
              Gunakan templat rasmi ini bagi mempercepatkan penyediaan dokumen perhubungan awam, pengurusan krisis, perancangan media, dan produksi korporat.
            </p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            ${TEMPLATES.map(t => `
              <div class="p-6 rounded-3xl bg-cinematic-900 border border-cinematic-800 flex flex-col justify-between space-y-4">
                <div>
                  <span class="text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-cinematic-950 text-emerald-400 border border-cinematic-800">Templat #${t.id}</span>
                  <h3 class="text-base font-bold text-white mt-2">${t.name}</h3>
                  <p class="text-xs text-slate-400 mt-1 leading-relaxed">${t.desc}</p>
                </div>
                <button onclick="navigator.clipboard ? navigator.clipboard.writeText('${t.name}') : null; this.textContent='✓ Disalin ke Papan Klip!';" class="w-full py-2 rounded-xl bg-cinematic-800 hover:bg-emerald-500 hover:text-black text-white text-xs font-bold transition">
                  Salin Templat Dokumen
                </button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    /* =========================================================
       FUNGSI CARIAN GLOBAL
       ========================================================= */
    function handleGlobalSearch(val) {
      if (!val || val.trim().length === 0) return;
      const q = val.toLowerCase().trim();

      for (const c of LEARNING_CENTRES) {
        for (const s of c.subjects) {
          if (s.title.toLowerCase().includes(q) || s.code.toLowerCase().includes(q)) {
            navigateTo('subject', { subjectId: s.id });
            return;
          }
        }
      }

      const matchArt = DEVELOPER_ARTWORKS.find(art => art.title.toLowerCase().includes(q) || art.tags.some(t => t.toLowerCase().includes(q)));
      if (matchArt) {
        navigateTo('developer_profile');
      }
    }

    /* =========================================================
       ENJIN PEMAPARAN UTAMA (ROUTER DISPATCHER)
       ========================================================= */
    function renderApp() {
      const container = document.getElementById('appContent');
      if (!container) return;

      switch(AppState.currentView) {
        case 'home':
          container.innerHTML = renderHomePage();
          break;
        case 'centre':
          container.innerHTML = renderCentrePage(AppState.selectedCentreId);
          break;
        case 'subject':
          container.innerHTML = renderSubjectPage(AppState.selectedSubjectId);
          break;
        case 'reader':
          container.innerHTML = renderReaderPage(AppState.selectedSubjectId, AppState.selectedChapterId);
          break;
        case 'developer_profile':
          container.innerHTML = renderDeveloperProfilePage();
          break;
        case 'comm_hub':
          container.innerHTML = renderCommHubPage();
          break;
        case 'visual_lab':
          container.innerHTML = renderVisualLabPage();
          break;
        case 'templates_vault':
          container.innerHTML = renderTemplatesVaultPage();
          break;
        default:
          container.innerHTML = renderHomePage();
      }
    }

    // Mulakan sistem bila DOM sedia
    window.addEventListener('DOMContentLoaded', renderApp);
    if (document.readyState === 'complete' || document.readyState === 'interactive') renderApp();
  </script>
</body>
</html>
