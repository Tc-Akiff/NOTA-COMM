          <h2>1.1 Kerangka Tripartit Seni Visual (The Tripartite Framework)</h2>
          <p>Berdasarkan rujukan standard antarabangsa <em>Art Fundamentals: Theory and Practice</em> (Edisi ke-12, 2012) oleh Otto G. Ocvirk, Robert E. Stinson, Philip R. Wigg, Robert O. Bone, dan David L. Cayton, sebarang manifestasi seni visual terdiri daripada persilangan tiga komponen utama yang tidak boleh dipisahkan:</p>

            <li><strong>3. Konteks (Context):</strong> Latar belakang sejarah, situasi sosio-budaya, ekonomi, pengaruh teknologi atau persekitaran politik tempat karya tersebut dicipta. Konteks menentukan bagaimana sesuatu karya difahami mengikut garis masa tamadun manusia.</li>

    function toggleChapterComplete(chapId) {
      const idx = AppState.completedChapters.indexOf(chapId);
      if (idx > -1) {
        AppState.completedChapters.splice(idx, 1);

        AppState.completedChapters.push(chapId);

      const modal = document.getElementById('videoModalOverlay');
      const iframe = document.getElementById('videoModalIframe');

      if (modal && iframe) {
        iframe.src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1&rel=0`;
        if (titleEl) titleEl.textContent = title;
        modal.classList.remove('hidden');
      }
    }

      const modal = document.getElementById('videoModalOverlay');
      const iframe = document.getElementById('videoModalIframe');
      if (modal && iframe) {

    /* =========================================================

      return `

          </div>

              <span>Eksperimen Kesan Kuleshov (Kuleshov Effect)</span>
            </h2>
            <p class="text-xs text-slate-300 leading-relaxed">
              Eksperimen montaj Soviet oleh Lev Kuleshov membuktikan emosi penonton bukan terhasil semata-mata daripada riak wajah pelakon, tetapi daripada gabungan dua syot yang disusun berurutan.
            </p>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
              <div class="flex items-center gap-4 bg-cinematic-950 p-6 rounded-2xl border border-cinematic-800 justify-center">
                <div class="text-center">
                  <div class="w-24 h-28 bg-cinematic-800 rounded-xl flex items-center justify-center border border-cinematic-700 text-4xl shadow-inner">
                    😐
                  </div>
                  <span class="text-[10px] text-slate-400 mt-2 block font-mono">Syot 1: Muka Neutral</span>
                </div>
                <span class="text-2xl font-bold text-amber-400">+</span>
                <div class="text-center">
                  <div id="kuleshovTarget" class="w-24 h-28 bg-cinematic-800 rounded-xl flex items-center justify-center border border-cinematic-700 text-4xl shadow-inner">
                    🍲
                  </div>
                  <span id="kuleshovTargetLabel" class="text-[10px] text-slate-400 mt-2 block font-mono">Syot 2: Mangkuk Sup</span>
                </div>
              </div>

              <div class="space-y-4">
                <label class="text-xs font-bold text-slate-300">Pilih Syot Rangsangan Kedua:</label>
                <div class="flex flex-wrap gap-2">
                  <button onclick="setKuleshov('🍲', 'Mangkuk Sup Hot', 'Kelaparan & Keinginan Makan')" class="px-3.5 py-2 bg-cinematic-800 hover:bg-brand-500 hover:text-black text-xs text-white rounded-xl border border-cinematic-700 transition font-semibold">🍲 Mangkuk Sup</button>
                  <button onclick="setKuleshov('👶', 'Bayi Tersenyum', 'Kasih Sayang & Naluri Kebapaan')" class="px-3.5 py-2 bg-cinematic-800 hover:bg-brand-500 hover:text-black text-xs text-white rounded-xl border border-cinematic-700 transition font-semibold">👶 Bayi Comel</button>
                  <button onclick="setKuleshov('⚰️', 'Keranda Mayat', 'Kedukaan, Pilu & Keinsafan')" class="px-3.5 py-2 bg-cinematic-800 hover:bg-brand-500 hover:text-black text-xs text-white rounded-xl border border-cinematic-700 transition font-semibold">⚰️ Keranda</button>

                <div class="p-4 bg-amber-500/10 border border-amber-500/30 rounded-2xl text-xs text-amber-300 leading-relaxed">
                  <strong>Tafsiran Persepsi Penonton:</strong> <span id="kuleshovResult">Penonton mentafsirkan pelakon berasa amat lapar dan teringin hendak makan.</span>

              </div>
            </div>
          </div>
        </div>
      `;
    }

    function setKuleshov(emoji, label, perception) {
      const target = document.getElementById('kuleshovTarget');
      const targetLabel = document.getElementById('kuleshovTargetLabel');
      const result = document.getElementById('kuleshovResult');
      if (target) target.textContent = emoji;
      if (targetLabel) targetLabel.textContent = 'Syot 2: ' + label;
      if (result) result.textContent = 'Penonton mentafsirkan wajah neutral tersebut menunjukkan emosi: ' + perception;
    }

    /* =========================================================
       FUNGSI PAPARAN: REPOSITORI 23 TEMPLAT KOMUNIKASI
       ========================================================= */
    function renderTemplatesVaultPage() {
      const TEMPLATES = [

        { id: 2, name: "Matriks Analisis Pihak Berkepentingan (Stakeholder Matrix)", desc: "Pemetaan kuasa vs minat (Mendelow's Power-Interest Matrix)." },
        { id: 3, name: "Kenyataan Segera Krisis (Holding Statement 60 Minit)", desc: "Draf maklum balas awal 'Golden Hour' krisis komunikasi sebelum siasatan selesai." },
        { id: 4, name: "Seni Bina Mesej Teras (Message House)", desc: "Payung mesej utama (Roof), 3 tiang sokongan (Pillars), dan bukti fakta (Proof Points)." },
        { id: 5, name: "Templat Siaran Media Piawai (Press Release)", desc: "Format piramid terbalik (5W1H), petikan jurucakap, dan latar belakang organisasi." },

            <p class="text-xs sm:text-sm text-slate-300 leading-relaxed max-w-3xl">
              Gunakan templat rasmi ini bagi mempercepatkan penyediaan dokumen perhubungan awam, pengurusan krisis, perancangan media, dan produksi korporat.
            </p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            ${TEMPLATES.map(t => `
              <div class="p-6 rounded-3xl bg-cinematic-900 border border-cinematic-800 flex flex-col justify-between space-y-4">
                <div>
                  <span class="text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-cinematic-950 text-emerald-400 border border-cinematic-800">Templat #${t.id}</span>

                  <p class="text-xs text-slate-400 mt-1 leading-relaxed">${t.desc}</p>
                </div>
                <button onclick="navigator.clipboard ? navigator.clipboard.writeText('${t.name}') : null; this.textContent='✓ Disalin ke Papan Klip!';" class="w-full py-2 rounded-xl bg-cinematic-800 hover:bg-emerald-500 hover:text-black text-white text-xs font-bold transition">
                  Salin Templat Dokumen
                </button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    /* =========================================================
       FUNGSI CARIAN GLOBAL
       ========================================================= */
    function handleGlobalSearch(val) {
      if (!val || val.trim().length === 0) return;
      const q = val.toLowerCase().trim();

      for (const c of LEARNING_CENTRES) {
        for (const s of c.subjects) {
          if (s.title.toLowerCase().includes(q) || s.code.toLowerCase().includes(q)) {
            navigateTo('subject', { subjectId: s.id });
            return;
          }
        }
      }

      const matchArt = DEVELOPER_ARTWORKS.find(art => art.title.toLowerCase().includes(q) || art.tags.some(t => t.toLowerCase().includes(q)));
      if (matchArt) {
        navigateTo('developer_profile');
      }
    }

    /* =========================================================
       ENJIN PEMAPARAN UTAMA (ROUTER DISPATCHER)
       ========================================================= */
    function renderApp() {
      const container = document.getElementById('appContent');
      if (!container) return;

      switch(AppState.currentView) {
        case 'home':
          container.innerHTML = renderHomePage();
          break;
        case 'centre':
          container.innerHTML = renderCentrePage(AppState.selectedCentreId);
          break;
        case 'subject':
          container.innerHTML = renderSubjectPage(AppState.selectedSubjectId);
          break;
        case 'reader':
          container.innerHTML = renderReaderPage(AppState.selectedSubjectId, AppState.selectedChapterId);
          break;
        case 'developer_profile':
          container.innerHTML = renderDeveloperProfilePage();
          break;
        case 'comm_hub':
          container.innerHTML = renderCommHubPage();
          break;
        case 'visual_lab':
          container.innerHTML = renderVisualLabPage();
          break;
        case 'templates_vault':
          container.innerHTML = renderTemplatesVaultPage();
          break;
        default:
          container.innerHTML = renderHomePage();
      }
    }

    // Mulakan sistem bila DOM sedia
    window.addEventListener('DOMContentLoaded', renderApp);
    if (document.readyState === 'complete' || document.readyState === 'interactive') renderApp();
  </script>
