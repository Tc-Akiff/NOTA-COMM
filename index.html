    function updateBookmarkBadge() {
      const badge = document.getElementById('bookmarkCountBadge');
      if (!badge) return;
      const count = AppState.bookmarks.length;
      if (count > 0) {
        badge.textContent = count;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('av_theme_dark', isDark ? 'true' : 'false');
    }

    if (localStorage.getItem('av_theme_dark') === 'true' || 
        (!localStorage.getItem('av_theme_dark') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }

    function navigateTo(view, params = {}) {
      AppState.currentView = view;
      if (params.centreId !== undefined) AppState.selectedCentreId = params.centreId;
      if (params.subjectId !== undefined) AppState.selectedSubjectId = params.subjectId;
      if (params.chapterId !== undefined) AppState.selectedChapterId = params.chapterId;
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderApp();
    }

    /* Video Modal Functions */
    function openVideoModal(youtubeId, title) {
      const overlay = document.getElementById('videoModalOverlay');
      const iframe = document.getElementById('videoModalIframe');
      const titleEl = document.getElementById('videoModalTitle');
      if (!overlay || !iframe) return;

      titleEl.textContent = title;
      iframe.src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1&rel=0`;
      overlay.classList.remove('hidden');
    }

    function closeVideoModal() {
      const overlay = document.getElementById('videoModalOverlay');
      const iframe = document.getElementById('videoModalIframe');
      if (!overlay || !iframe) return;

      iframe.src = "";
      overlay.classList.add('hidden');
    }

          break;
        case 'centre':
          container.innerHTML = renderCentrePage(AppState.selectedCentreId);
          break;
        case 'subject':
          container.innerHTML = renderSubjectPage(AppState.selectedSubjectId);
          break;
        case 'reader':
          container.innerHTML = renderReaderPage(AppState.selectedSubjectId, AppState.selectedChapterId);
          break;
        case 'simulator':
          container.innerHTML = renderSimulatorPage();
          initSimulatorEvents();
          break;
        case 'developer_profile':
          container.innerHTML = renderDeveloperProfilePage();
          break;
        default:

    /* Global Search */
    function handleGlobalSearch(q) {
      if (q && q.trim().length > 1) {
        document.getElementById('searchOverlay')?.classList.remove('hidden');
        document.getElementById('modalSearchInput').value = q;
        executeDeepSearch(q);
      }
    }

    function closeSearch() {
      document.getElementById('searchOverlay')?.classList.add('hidden');
    }

    function executeDeepSearch(query) {
      const container = document.getElementById('searchResultsList');
      if (!container) return;

      const q = (query || '').toLowerCase().trim();
      const results = [];

      DEVELOPER_ARTWORKS.forEach(art => {
        if (art.title.toLowerCase().includes(q) || art.category.toLowerCase().includes(q) || art.synopsis.toLowerCase().includes(q)) {
          results.push({
            type: 'Karya Video',
            title: art.title,
            subtitle: `${art.category} • ${art.year}`,
            action: () => { closeSearch(); navigateTo('developer_profile'); openVideoModal(art.youtubeId, art.title); }
          });
        }
      });

      LEARNING_CENTRES.forEach(c => {
        c.subjects.forEach(s => {
          if (s.title.toLowerCase().includes(q) || s.code.toLowerCase().includes(q)) {
            results.push({
              type: 'Subjek',
              title: `${s.code}: ${s.title}`,
              subtitle: c.title,
              action: () => { closeSearch(); navigateTo('subject', { subjectId: s.id }); }
            });
          }
        });
      });

      if (results.length === 0) {
        container.innerHTML = `<p class="text-slate-400 text-center py-8">Tiada padanan dijumpai untuk "${query}".</p>`;
        return;
      }

      container.innerHTML = results.slice(0, 10).map((r, i) => `
        <div onclick="window.searchActions[${i}]()" class="py-3 px-2 hover:bg-slate-50 dark:hover:bg-cinematic-850 rounded-xl cursor-pointer flex items-center justify-between">
          <div>
            <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-purple-100 dark:bg-purple-950 text-purple-700 dark:text-purple-300 mb-1 inline-block">${r.type}</span>
            <h4 class="font-bold text-slate-900 dark:text-white text-xs">${r.title}</h4>
            <p class="text-[11px] text-slate-400">${r.subtitle}</p>
          </div>
          <span class="text-xs text-purple-500 font-semibold">Buka →</span>
        </div>
      `).join('');

      window.searchActions = results.slice(0, 10).map(r => r.action);
    }

    // Keyboard ESC for modals
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeSearch();
        closeVideoModal();
      }
    });

    window.addEventListener('DOMContentLoaded', renderApp);
    if (document.readyState === 'complete' || document.readyState === 'interactive') renderApp();
  </script>
</body>
</html>
